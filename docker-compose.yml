services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: partner
      POSTGRES_PASSWORD: partner
      POSTGRES_DB: partner_onboarding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner -d partner_onboarding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
